server:
  port: 8080

spring:
  application:
    name: Smart Room Monitor
  datasource:
    url: jdbc:postgresql://localhost:5432/smartroom
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    root: INFO
    com.smartroom: DEBUG

custom:
  sensor:
    default-poll-interval-seconds: 10



