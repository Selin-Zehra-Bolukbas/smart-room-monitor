server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: Smart Room Monitor

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartroom}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.smartroom: DEBUG

custom:
  sensor:
    default-poll-interval-seconds: 10

weather:
  api:
    key: ${OPENWEATHER_API_KEY}
    url: https://api.openweathermap.org/data/2.5/forecast